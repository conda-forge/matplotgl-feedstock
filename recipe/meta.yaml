{% set name = "matplotgl" %}
{% set version = "25.11.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/matplotgl-{{ version }}.tar.gz
  sha256: d83a89cb6bab411559e3a67eb4271fb24d2bc625ef674e6f8a540b6025165e3d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - pythreejs
    - anywidget

test:
  imports:
    - matplotgl
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://scipp.github.io/matplotgl/
  summary: Matplotlib clone for Jupyter that uses WebGL via Pythreejs
  dev_url: https://github.com/scipp/matplotgl
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nvaytet
